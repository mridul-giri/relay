name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, agent, web]
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.${{ matrix.app }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://relay.mridulgiri.com
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/relay-${{ matrix.app }}:${{ github.sha }}
